{"scenario_id": "sc-02-trace-codes-benefits", "input": "Việc gán trace code có giúp team phát hiện các mẫu lỗi lặp lại trong hệ thống không?", "slide": {"id": "s29", "title": "Chuẩn hóa notes thành trace codes", "keyword": "trace codes"}, "output": {"scope": "in_scope", "answer": "Có, việc gán trace code giúp team gom nhóm các mẫu hành vi hoặc lỗi tương tự (recurring failure patterns) thành các danh mục có cấu trúc rõ ràng. Sau khi review khoảng 30–50 traces, các mẫu lỗi lặp lại sẽ xuất hiện, giúp team chuyển các ghi chú tự do (như \"bot xử lý sai ý khách\" hay \"agent hứa hoàn tiền quá sớm\") thành các trace code chuẩn hóa (như wrong_intent, premature_commit). Điều này tạo ra một ngôn ngữ chung cho team, giúp dễ dàng đo lường, so sánh và sửa lỗi hệ thống.", "sources": [{"doc_id": "ai-evals-m04", "section_id": "step-3-cluster-into-trace-codes", "quote": "- Each category represents a recurring behavior worth tracking"}, {"doc_id": "slide-day19-20", "section_id": "s35", "quote": "Trace codes — ngôn ngữ chung của team"}], "followup_questions": ["Một trace code tiêu chuẩn cần đáp ứng những tiêu chí nào về mặt cấu trúc?", "Tại sao việc giữ các trace code ở dạng nhị phân (Yes/No) lại quan trọng đối với việc gán nhãn tự động sau này?", "Làm thế nào để team chuyển từ các ghi chú thô (raw notes) sang việc thống nhất bộ trace code chung?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Có, việc gán trace code giúp team gom nhóm các mẫu hành vi hoặc lỗi tương tự (recurring failure patterns) thành các danh mục có cấu trúc rõ ràng. Sau khi review khoảng 30–50 traces, các mẫu lỗi lặp lại sẽ xuất hiện, giúp team chuyển các ghi chú tự do (như \\\"bot xử lý sai ý khách\\\" hay \\\"agent hứa hoàn tiền quá sớm\\\") thành các trace code chuẩn hóa (như wrong_intent, premature_commit). Điều này tạo ra một ngôn ngữ chung cho team, giúp dễ dàng đo lường, so sánh và sửa lỗi hệ thống.\",\n  \"sources\": [\n    {\n      \"doc_id\": \"ai-evals-m04\",\n      \"section_id\": \"step-3-cluster-into-trace-codes\",\n      \"text\": \"After reviewing 30–50 traces, repetition sets in. This is where structure emerges. You now cluster your notes into trace codes:\\n- Groups of similar success or failure patterns\\n- Each category represents a recurring behavior worth tracking\"\n    },\n    {\n      \"doc_id\": \"slide-day19-20\",\n      \"section_id\": \"s35\",\n      \"text\": \"Trace codes — ngôn ngữ chung của team\\nCùng một vấn đề, cùng một tên.\"\n    }\n  ],\n  \"followup_questions\": [\n    \"Một trace code tiêu chuẩn cần đáp ứng những tiêu chí nào về mặt cấu trúc?\",\n    \"Tại sao việc giữ các trace code ở dạng nhị phân (Yes/No) lại quan trọng đối với việc gán nhãn tự động sau này?\",\n    \"Làm thế nào để team chuyển từ các ghi chú thô (raw notes) sang việc thống nhất bộ trace code chung?\"\n  ]\n}", "latency_s": 3.53, "cost_usd": null, "verdict": null, "rationale": "", "human_label": ""}, {"scenario_id": "sc-03-compare-code-judge", "input": "So sánh ưu và nhược điểm giữa Code-based evaluation và LLM-as-a-Judge trong quy trình đánh giá AI?", "slide": null, "output": {"scope": "in_scope", "answer": "Trong quy trình đánh giá hệ thống AI, việc lựa chọn giữa **Code-based evaluation** (đánh giá dựa trên mã lệnh/deterministic) và **LLM-as-a-Judge** (dùng LLM làm giám khảo) có sự phân chia rõ ràng về ưu nhược điểm, trong đó nguyên tắc chung là luôn ưu tiên dùng code trước, và chỉ chuyển sang LLM-as-Judge khi các quy tắc code không đủ khả năng đánh giá.\n\n### 1. Code-based Evaluation (Đánh giá dựa trên code)\n* **Ưu điểm:**\n  - **Tốc độ:** Thực thi cực nhanh, chỉ tính bằng mili-giây thay vì vài giây.\n  - **Chi phí:** Miễn phí về mặt chi phí tính toán (compute), không tốn tiền gọi API của LLM.\n  - **Tính ổn định (Deterministic):** Cho kết quả tái lập 100% (cùng một input luôn trả ra cùng một kết quả, không có sự biến thiên của LLM).\n  - **Khả năng debug và vận hành:** Dễ hiểu nguyên nhân vì sao eval pass hay fail, dễ dàng chạy trực tiếp trong critical path (luồng xử lý chính) để tự động retry khi gặp lỗi.\n* **Nhược điểm / Giới hạn:**\n  - Không thể đánh giá các tiêu chí mang tính chủ quan hoặc đòi hỏi sắc thái ngôn ngữ (ví dụ: câu trả lời có thực sự hữu ích với người dùng không, lập luận có logic và thuyết phục không, giọng điệu có đúng thương hiệu không).\n  - Thường chỉ đóng vai trò là \"phần nền\" (floor) để kiểm tra các yếu tố cơ học như đúng format, không thiếu trường bắt buộc, gọi đúng tool, hoặc không lộ thông tin cấm.\n\n### 2. LLM-as-a-Judge (Dùng LLM làm giám khảo)\n* **Ưu điểm:**\n  - Giải quyết được các bài toán đánh giá có tính chủ quan, đòi hỏi hiểu biết về sắc thái ngôn ngữ, ngữ cảnh, sự nhất quán trong lập luận, tính thuyết phục, hoặc mức độ hữu ích đối với người dùng thực tế.\n* **Nhược điểm:**\n  - Chi phí cao hơn do phải gọi API LLM cho mỗi lần chấm điểm.\n  - Tốc độ chậm hơn so với việc chạy hàm code thông thường.\n  - Có thể tồn tại độ biến thiên (variability) do đặc tính của LLM.\n\n**Lời khuyên:** Bạn nên áp dụng chiến lược tuần tự (sequencing): hãy vét cạn các bài kiểm tra bằng code trước cho các tiêu chí rõ ràng, sau đó mới xây dựng các bộ đánh giá LLM-Judge ở tầng trên cho những khía cạnh mang tính định tính và sắc thái.", "sources": [{"doc_id": "ai-evals-m05", "section_id": "choosing-the-automation-method-code-based-vs-llm-as-judge", "quote": "Choosing the Automation Method: Code-Based vs. LLM-as-Judge\n\n\nOnce you've identified a generalization gap that warrants automation, you must choose the appropriate evaluation method. The default path should always be **code-based evaluation** because it's faster, cheaper, and 100% reproducible (deterministic)."}, {"doc_id": "slide-day19-20", "section_id": "s40", "quote": "s40 — Chọn cách đánh giá: Code-based hay LLM-as-Judge?\n\n\nChọn cách đánh giá: Code-based hay LLM-as-Judge?\n\nNếu có thể kiểm tra bằng code — hãy dùng code trước.\n\nCODE-BASED — MẶC ĐỊNH ƯU TIÊN                            LLM-AS-JUDGE — KHI CODE KHÔNG ĐỦ\n\nNhanh hơn     Rẻ hơn     Ổn định                        Dùng khi tiêu chí phụ thuộc vào sắc thái ngôn ngữ và\n\nngữ cảnh — không thể viết thành rule rõ ràng."}, {"doc_id": "ai-evals-m06", "section_id": "key-takeaways-and-definitions", "quote": "- **Default Evaluation Path:** The default for automated evaluation should always be code-based because it is faster, cheaper, and 100% reproducible (deterministic)."}], "followup_questions": ["Khi nào một Product Manager nên quyết định chuyển từ Code-based evaluation sang sử dụng LLM-as-a-Judge?", "Cấu trúc cơ bản của một code-based eval gồm những thành phần nào để đảm bảo tính dễ debug?", "Làm thế nào để kết hợp cả Code-based evaluation và LLM-as-a-Judge trong cùng một release gate hiệu quả?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Trong quy trình đánh giá hệ thống AI, việc lựa chọn giữa **Code-based evaluation** (đánh giá dựa trên mã lệnh/deterministic) và **LLM-as-a-Judge** (dùng LLM làm giám khảo) có sự phân chia rõ ràng về ưu nhược điểm, trong đó nguyên tắc chung là luôn ưu tiên dùng code trước, và chỉ chuyển sang LLM-as-Judge khi các quy tắc code không đủ khả năng đánh giá.\\n\\n### 1. Code-based Evaluation (Đánh giá dựa trên code)\\n* **Ưu điểm:**\\n  - **Tốc độ:** Thực thi cực nhanh, chỉ tính bằng mili-giây thay vì vài giây.\\n  - **Chi phí:** Miễn phí về mặt chi phí tính toán (compute), không tốn tiền gọi API của LLM.\\n  - **Tính ổn định (Deterministic):** Cho kết quả tái lập 100% (cùng một input luôn trả ra cùng một kết quả, không có sự biến thiên của LLM).\\n  - **Khả năng debug và vận hành:** Dễ hiểu nguyên nhân vì sao eval pass hay fail, dễ dàng chạy trực tiếp trong critical path (luồng xử lý chính) để tự động retry khi gặp lỗi.\\n* **Nhược điểm / Giới hạn:**\\n  - Không thể đánh giá các tiêu chí mang tính chủ quan hoặc đòi hỏi sắc thái ngôn ngữ (ví dụ: câu trả lời có thực sự hữu ích với người dùng không, lập luận có logic và thuyết phục không, giọng điệu có wup_questions": ["Sự khác biệt giữa True Positive Rate (TPR) và True Negative Rate (TNR) trong calibration là gì?", "Tại sao ô False Positives lại được xem là vùng nguy hiểm nhất khi vận hành hệ thống AI trong production?", "Làm thế nào để cải thiện chỉ số True Negative Rate (TNR) thấp của một LLM judge bằng near-miss examples?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Confusion Matrix (Ma trận nhầm lẫn) trong đánh giá hệ thống AI là một bảng 2x2 dùng để đối chiếu kết quả đánh giá giữa LLM Judge (giám khảo AI) và con người (human) trên cùng một tập dữ liệu. Bảng này giúp chia kết quả thành 4 ô (quadrants) để biết chính xác điểm đồng thuận và bất đồng thuận:\\n\\n- **True Positives (TP):** Judge nói Pass, người nói Pass (Cả hai đều đồng ý kết quả đạt).\\n- **False Positives (FP):** Judge nói Pass, người nói Fail (Judge để lọt các kết quả tồi ra production — đây là ô nguy hiểm nhất).\\n- **False Negatives (FN):** Judge nói Fail, người nói Pass (Judge từ chối nhầm các kết quả tốt — gây lãng phí thời gian kỹ sư).\\n- **True Negatives (TN):** Judge nói Fail, người nói Fail (Cả hai đều đồng ý kết quả không đạt).\\n\\nThông qua Confusion Matrix, bạn có thể tính các chỉ số quan trọng như True Positive Rate (TPR) và True Negative Rate (TNR) để biết có nên tin tưởng LLM judge hay không và cần cải thiện prompt như thế nào.\",\n  \"sources\": [\n    {\n      \"doc_id\": \"ai-evals-m09\",\n      \"section_id\": \"key-takeaways-and-definitions\",\n      \"quote\": \"Confusion Matrix — A 2×2 table that categorizes every judge verdict into one of four outcomes: True Positive (both agree Pass), False Positive (judge says Pass, human says Fail), False Negative (judge says Fail, human says Pass), and True Negative (both agree Fail).\"\n    }\n  ],\n  \"followup_questions\": [\n    \"Sự khác biệt giữa True Positive Rate (TPR) và True Negative Rate (TNR) trong calibration là gì?\",\n    \"Tại sao ô False Positives lại được xem là vùng nguy hiểm nhất khi vận hành hệ thống AI trong production?\",\n    \"Làm thế nào để cải thiện chỉ số True Negative Rate (TNR) thấp của một LLM judge bằng near-miss examples?\"\n  ]\n}", "latency_s": 4.34, "cost_usd": null, "verdict": null, "rationale": "", "human_label": ""}, {"scenario_id": "sc-11-underspecified-slide-context", "input": "Phương pháp đó khác gì so với cái trước?", "slide": {"id": "s51", "title": "Vì sao calibration là bước cốt lõi", "keyword": "calibration"}, "output": {"scope": "in_scope", "answer": "Chào bạn, khi nói về khái niệm calibration (hiệu chỉnh bộ chấm), điểm khác biệt cốt lõi so với việc chạy đánh giá thông thường nằm ở chỗ: các phương pháp đánh giá trước đó (như chạy LLM judge trên tập dữ liệu và nhìn vào pass rate 85%) chỉ cho bạn biết bộ chấm 'nghĩ' gì, trong khi calibration giúp bạn kiểm chứng xem bộ chấm đó có suy nghĩ và đánh giá giống với các chuyên gia con người (domain experts) hay không. Một bộ judge chưa được calibrate sẽ cho ra những con số trên dashboard hoàn toàn vô nghĩa và rủi ro nếu đội ngũ dựa vào đó để ra quyết định release sản phẩm.", "sources": [{"doc_id": "ai-evals-m09", "section_id": "why-calibration-is-the-whole-game", "quote": "A pass rate tells you what the judge thinks. Calibration tells you whether the judge thinks the same way your domain experts do."}], "followup_questions": ["Hậu quả của việc sử dụng một uncalibrated judge (bộ chấm chưa hiệu chỉnh) đối với quyết định release sản phẩm là gì?", "Quy trình lặp (iterative loop) trong calibration gồm những bước nào?", "Làm thế nào để đo lường độ tin cậy của bộ chấm thông qua True Positive Rate và True Negative Rate?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Chào bạn, khi nói về khái niệm calibration (hiệu chỉnh bộ chấm), điểm khác biệt cốt lõi so với việc chạy đánh giá thông thường nằm ở chỗ: các phương pháp đánh giá trước đó (như chạy LLM judge trên tập dữ liệu và nhìn vào pass rate 85%) chỉ cho bạn biết bộ chấm 'nghĩ' gì, trong khi calibration giúp bạn kiểm chứng xem bộ chấm đó có suy nghĩ và đánh giá giống với các chuyên gia con người (domain experts) hay không. Một bộ judge chưa được calibrate sẽ cho ra những con số trên dashboard hoàn toàn vô nghĩa và rủi ro nếu đội ngũ dựa vào đó để ra quyết định release sản phẩm.\",\n  \"sources\": [\n    {\n      \"doc_id\": \"ai-evals-m09\",\n      \"section_id\": \"why-calibration-is-the-whole-game\",\n      \"text\": \"A pass rate tells you what the judge thinks. Calibration tells you whether the judge thinks the same way your domain experts do.\"\n    }\n  ],\n  \"followup_questions\": [\n    \"Hậu quả của việc sử dụng một uncalibrated judge (bộ chấm chưa hiệu chỉnh) đối với quyết định release sản phẩm là gì?\",\n    \"Quy trình lặp (iterative loop) trong calibration gồm những bước nào?\",\n    \"Làm thế nào để đo lường độ tin cậy của bộ chấm thông qua True Positive Rate và True Negative Rate?\"\n  ]\n}", "latency_s": 3.3, "cost_usd": null, "verdict": null, "rationale": "", "human_label": ""}, {"scenario_id": "sc-12-multi-intent-tpr", "input": "True Positive Rate trong calibration là gì và công thức tính cụ thể như thế nào?", "slide": {"id": "s52", "title": "Reliability Metrics", "keyword": "true positive rate"}, "output": {"scope": "in_scope", "answer": "Trong quá trình calibration (hiệu chuẩn) LLM judge, True Positive Rate (TPR) — hay còn gọi là Sensitivity — đo lường mức độ tin cậy của judge trong việc nhận diện các output đạt chất lượng tốt (tức là khi chuyên gia con người dán nhãn Pass). \n\nCông thức tính cụ thể:\nTPR = True Positives / (True Positives + False Negatives)\n\nTrong đó:\n- True Positives (TP): Trường hợp cả judge và con người cùng đồng thuận Pass.\n- False Negatives (FN): Trường hợp judge đánh giá Fail nhưng thực tế con người đánh giá Pass (judge bị nhầm lẫn, chặn nhầm output tốt, gây tốn công sức rà soát oan).\n\nTPR cao cho thấy judge rất giỏi trong việc bắt trúng các output đạt chuẩn.", "sources": [{"doc_id": "ai-evals-m09", "section_id": "key-takeaways-and-definitions", "quote": "**True Positive Rate (TPR) / Sensitivity** — The percentage of human-labeled Pass traces that the judge also labels Pass"}], "followup_questions": ["True Negative Rate (TNR) khác gì với True Positive Rate và tại sao TNR thường khó cải thiện hơn ở các LLM judge?", "Làm thế nào để xây dựng một ma trận nhầm lẫn (confusion matrix) từ dữ liệu đánh giá của chuyên gia và judge?", "Quá trình calibration giúp khắc phục những điểm mù nào của LLM judge trước khi đưa hệ thống AI vào production?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Trong quá trình calibration (hiệu chuẩn) LLM judge, True Positive Rate (TPR) — hay còn gọi là Sensitivity — đo lường mức độ tin cậy của judge trong việc nhận diện các output đạt chất lượng tốt (tức là khi chuyên gia con người dán nhãn Pass). \\n\\nCông thức tính cụ thể:\\nTPR = True Positives / (True Positives + False Negatives)\\n\\nTrong đó:\\n- True Positives (TP): Trường hợp cả judge và con người cùng đồng thuận Pass.\\n- False Negatives (FN): Trường hợp judge đánh giá Fail nhưng thực tế con người đánh giá Pass (judge bị nhầm lẫn, chặn nhầm output tốt, gây tốn công sức rà soát oan).\\n\\nTPR cao cho thấy judge rất giỏi trong việc bắt trúng các output đạt chuẩn.\",\n  \"sources\": [\n    {\n      \"doc_id\": \"ai-evals-m09\",\n      \"section_id\": \"key-takeaways-and-definitions\",\n      \"quote\": \"True Positive Rate (TPR) / Sensitivity — The percentage of human-labeled Pass traces that the judge also labels Pass. Measures how reliably the judge catches good outputs. Formula: TP / (TP + FN).\"\n    }\n  ],\n  \"followup_questions\": [\n    \"True Negative Rate (TNR) khác gì với True Positive Rate và tại sao TNR thường khó cải thiện hơn ở các LLM judge?\",\n    \"Làm thế nào để xây dựng một ma trận nhầm lẫn (confusion matrix) từ dữ liệu đánh giá của chuyên gia và judge?\",\n    \"Quá trình calibration giúp khắc phục những điểm mù nào của LLM judge trước khi đưa hệ thống AI vào production?\"\n  ]\n}", "latency_s": 9.92, "cost_usd": null, "verdict": null, "rationale": "", "human_label": ""}, {"scenario_id": "sc-13-false-premise-judge-calibration", "input": "LLM Judge không bao giờ cần calibrate vì model GPT-4 luôn đánh giá khách quan 100%, đúng không anh?", "slide": {"id": "s51", "title": "Vì sao calibration là bước cốt lõi", "keyword": "calibration"}, "output": {"scope": "in_scope", "answer": "Không đúng chút nào! Nhận định này không chính xác. Dù model mạnh như GPT-4, phán quyết của một LLM Judge bản chất vẫn chỉ là **một ý kiến, không phải sự thật tuyệt đối**. Trọng tài AI hoàn toàn có thể mắc sai sót hoặc thiên vị, và kết quả chấm điểm của nó chưa chắc đã đồng quan điểm với chuyên gia con người.\n\nĐó chính là lý do vì sao **calibration (hiệu chỉnh)** là bước cốt lõi không thể bỏ qua: quy trình này so sánh kết quả đánh giá của judge với nhãn của con người (human labels) trên cùng một tập trace để đo lường độ tin cậy. Nếu không calibrate, bạn đang đưa ra các quyết định release sản phẩm dựa trên những con số vô nghĩa trên dashboard.", "sources": [{"doc_id": "ai-evals-m09", "section_id": "intro", "quote": "But an LLM judge's verdict is an opinion, not a fact, and the quality of that opinion must be measured before you use it to make shipping decisions"}], "followup_questions": ["Làm thế nào để xây dựng confusion matrix từ kết quả so sánh giữa LLM Judge và nhãn của con người?", "True Positive Rate (TPR) và True Negative Rate (TNR) khác nhau như thế nào trong việc đánh giá chất lượng của một LLM Judge?", "Tại sao các uncalibrated judge thường có xu hướng dễ dãi và bỏ qua các output kém chất lượng?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Không đúng chút nào! Nhận định này không chính xác. Dù model mạnh như GPT-4, phán quyết của một LLM Judge bản chất vẫn chỉ là **một ý kiến, không phải sự thật tuyệt đối**. Trọng tài AI hoàn toàn có thể mắc sai sót hoặc thiên vị, và kết quả chấm điểm của nó chưa chắc đã đồng quan điểm với chuyên gia con người.\\n\\nĐó chính là lý do vì sao **calibration (hiệu chỉnh)** là bước cốt lõi không thể bỏ qua: quy trình này so sánh kết quả đánh giá của judge với nhãn của con người (human labels) trên cùng một tập trace để đo lường độ tin cậy. Nếu không calibrate, bạn đang đưa ra các quyết định release sản phẩm dựa trên những con số vô nghĩa trên dashboard.\",\n  \"sources\": [\n    {\n      \"doc_id\": \"ai-evals-m09\",\n      \"section_id\": \"intro\",\n      \"quote\": \"An LLM judge's verdict is an opinion, not a fact, and the quality of that opinion must be measured before you use it to make shipping decisions. The process of measuring it is called **calibration**: comparing the judge's verdicts against human labels, trace by trace, and quantifying where they agree and disagree.\"\n    }\n  ],\n  \"followup_questions\": [\n    \"Làm thế nào để xây dựng confusion matrix từ kết quả so sánh giữa LLM Judge và nhãn của con người?\",\n    \"True Positive Rate (TPR) và True Negative Rate (TNR) khác nhau như thế nào trong việc đánh giá chất lượng của một LLM Judge?\",\n    \"Tại sao các uncalibrated judge thường có xu hướng dễ dãi và bỏ qua các output kém chất lượng?\"\n  ]\n}", "latency_s": 4.05, "cost_usd": null, "verdict": null, "rationale": "", "human_label": ""}, {"scenario_id": "sc-14-false-premise-high-pass-rate", "input": "Nếu LLM Judge cho pass rate 95% trên dataset thì hệ thống chắc chắn đã sẵn sàng release mà không cần đo agreement người đúng không?", "slide": null, "output": {"scope": "in_scope", "answer": "Không, hệ thống chưa chắc đã sẵn sàng release. Một mức pass rate 95% do LLM Judge chấm trên dataset hoàn toàn có thể đánh lừa bạn nếu chưa được hiệu chuẩn (calibrated) và đo lường độ đồng thuận (agreement) với con người. \n\nTrong thực tế đánh giá AI, aggregate pass rate (tỷ lệ pass tổng hợp) có thể tương đồng nhưng lại che giấu sự bất đồng lớn ở mức độ từng trace (từng mẫu dữ liệu riêng lẻ). Một LLM Judge chưa được kiểm định qua human labels thực chất chỉ là \"một cỗ máy tạo ý kiến\" (opinion generator) chứ chưa phải là công cụ đo lường chất lượng đáng tin cậy. Ví dụ, LLM thường có xu hướng mặc định đánh giá tích cực (lenient), dẫn đến việc chúng có thể bỏ qua các lỗi nghiêm trọng (False Positives cao), khiến bạn lầm tưởng hệ thống đang rất tốt.\n\nDo đó, việc calibration (hiệu chuẩn judge so với nhãn của con người thông qua Confusion Matrix để đo True Positive Rate và True Negative Rate) là bắt buộc trước khi quyết định đưa hệ thống ra production.", "sources": [{"doc_id": "ai-evals-m09", "section_id": "key-takeaways-and-definitions", "quote": "** An LLM judge that hasn't been validated against human labels is an opinion generator, not a quality measurement tool"}, {"doc_id": "ai-evals-m09", "section_id": "calibration-the-confusion-matrix-method", "quote": "At first glance, this looks promising. The pass rates are similar (70% vs 77%). But aggregate pass rates can hide massive disagreement at the individual trace level."}, {"doc_id": "ai-evals-m09", "section_id": "the-confusion-matrix", "quote": "This is the dangerous quadrant for production"}], "followup_questions": ["Confusion Matrix giúp chúng ta phân biệt True Positives và False Positives như thế nào khi đánh giá LLM Judge?", "True Negative Rate (TNR) và True Positive Rate (TPR) đóng vai trò gì trong việc kiểm định độ tin cậy của LLM Judge?", "Làm thế nào để thực hiện vòng lặp calibration (calibration loop) nhằm cải thiện độ chính xác của LLM Judge qua các lần lặp prompt?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Không, hệ thống chưa chắc đã sẵn sàng release. Một mức pass rate 95% do LLM Judge chấm trên dataset hoàn toàn có thể đánh lừa bạn nếu chưa được hiệu chuẩn (calibrated) và đo lường độ đồng thuận (agreement) với con người. \\n\\nTrong thực tế đánh giá AI, aggregate pass rate (tỷ lệ pass tổng hợp) có thể tương đồng nhưng lại che giấu sự bất đồng lớn ở mức độ từng trace (từng mẫu dữ liệu riêng lẻ). Một LLM Judge chưa được kiểm định qua human labels thực chất chỉ là \\\"một cỗ máy tạo ý kiến\\\" (opinion generator) chứ chưa phải là công cụ đo lường chất lượng đáng tin cậy. Ví dụ, LLM thường có xu hướng mặc định đánh giá tích cực (lenient), dẫn đến việc chúng có thể bỏ qua các lỗi nghiêm trọng (False Positives cao), khiến bạn lầm tưởng hệ thống đang rất tốt.\\n\\nDo đó, việc calibration (hiệu chuẩn judge so với nhãn của con người thông qua Confusion Matrix để đo True Positive Rate và True Negative Rate) là bắt buộc trước khi quyết định đưa hệ thống ra production.\",\n  \"sources\": [\n    {\n      \"doc_id\": \"ai-evals-m09\",\n      \"section_id\": \"key-takeaways-and-definitions\",\n      \"quote\": \"Calibration is non-negotiable. An LLM judge that hasn't been validated against human labels is an opinion generator, not a quality measurement tool.\"\n    },\n    {\n      \"doc_id\": \"ai-evals-m09\",\n      \"section_id\": \"calibration-the-confusion-matrix-method\",\n      \"quote\": \"At first glance, this looks promising. The pass rates are similar (70% vs 77%). But aggregate pass rates can hide massive disagreement at the individual trace level.\"\n    },\n    {\n      \"doc_id\": \"ai-evals-m09\",\n      \"section_id\": \"the-confusion-matrix\",\n      \"quote\": \"False Positives (22): Judge said Pass, human said Fail. The judge let bad outputs through. This is the dangerous quadrant for production.\"\n    }\n  ],\n  \"followup_questions\": [\n    \"Confusion Matrix giúp chúng ta phân biệt True Positives và False Positives như thế nào khi đánh giá LLM Judge?\",\n    \"True Negative Rate (TNR) và True Positive Rate (TPR) đóng vai trò gì trong việc kiểm định độ tin cậy của LLM Judge?\",\n    \"Làm thế nào để thực hiện vòng lặp calibration (calibration loop) nhằm cải thiện độ chính xác của LLM Judge qua các lần lặp prompt?\"\n  ]\n}", "latency_s": 4.11, "cost_usd": null, "verdict": null, "rationale": "", "human_label": ""}, {"scenario_id": "sc-15-false-premise-code-checks-cost", "input": "Chạy eval bằng Code checks luôn đắt đỏ và tốn tài nguyên hơn rất nhiều so với gọi LLM Judge API phải không?", "slide": null, "output": {"scope": "in_scope", "answer": "Không phải vậy, thực tế là ngược lại hoàn toàn! Các đánh giá dựa trên mã (code-based evaluation / code checks) thực chất nhanh hơn, hoàn toàn miễn phí về mặt tài nguyên tính toán (free compute) và có thể chạy trong vài mili-giây. Ngược lại, phương pháp LLM-as-Judge mới là phương pháp tốn chi phí và tài nguyên hơn vì phải thực hiện các cuộc gọi API LLM tốn kém cho mỗi lần chạy.", "sources": [{"doc_id": "ai-evals-m05", "section_id": "choosing-the-automation-method-code-based-vs-llm-as-judge", "quote": "The default path should always be **code-based evaluation** because it's faster, cheaper, and 100% reproducible (deterministic)"}, {"doc_id": "ai-evals-m06", "section_id": "what-exactly-is-a-code-based-eval", "quote": "Code evals are fast and cheap — deterministic checks cost nothing per run compared to LLM inference."}, {"doc_id": "ai-evals-m07", "section_id": "intro", "quote": "The economics are different from code evals. An LLM judge costs inference on every run."}], "followup_questions": ["Khi nào thì bắt buộc phải dùng LLM-as-Judge thay vì code checks?", "Tại sao code-based evaluation lại mang lại tính tất định (determinism) tốt hơn so với LLM Judge?", "Quy trình tối ưu nên sắp xếp thứ tự chạy code checks và LLM-as-Judge như thế nào trong một hệ thống eval?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Không phải vậy, thực tế là ngược lại hoàn toàn! Các đánh giá dựa trên mã (code-based evaluation / code checks) thực chất nhanh hơn, hoàn toàn miễn phí về mặt tài nguyên tính toán (free compute) và có thể chạy trong vài mili-giây. Ngược lại, phương pháp LLM-as-Judge mới là phương pháp tốn chi phí và tài nguyên hơn vì phải thực hiện các cuộc gọi API LLM tốn kém cho mỗi lần chạy.\",\n  \"sources\": ộ phong phú của bối cảnh (context richness), độ mơ hồ (ambiguity), hoặc ngôn ngữ.\n\n2. **Định nghĩa values (các giá trị):** Liệt kê các giá trị cụ thể cho từng dimension sao cho khi đổi giá trị, câu trả lời hoặc chiến lược xử lý của chatbot cũng phải thay đổi theo.\n\n3. **Tạo combinations (tổ hợp các ô):** Kết hợp các chiều để tạo ra ma trận tổ hợp (ví dụ: 4 persona × 4 intent = 16 ô). Từ ma trận này, con người sẽ chủ động lựa chọn các ô có ý nghĩa thực tế đối với sản phẩm (đáng test) và loại bỏ các tổ hợp phi lý (ví dụ: Manager duyệt khóa nhưng lại hỏi một khái niệm nhập môn cơ bản). Việc này giúp bạn chọn ra khoảng 15–20 scenario có chủ đích.\n\n4. **Thêm real-world constraints (ràng buộc đời thực):** Làm cho các scenario bớt \"sạch\" và giống người dùng thật hơn bằng cách lồng ghép các yếu tố như thiếu thông tin, dùng từ ngữ mơ hồ, hoặc bất đồng bộ về ngữ cảnh để kiểm tra khả năng xử lý biên (edge cases) của chatbot.\n\n5. **Viết thành user inputs tự nhiên:** Với các ô/scenario đã chọn, bạn sử dụng LLM như một công cụ hỗ trợ để paraphrase thành 2–3 cách diễn đạt tự nhiên khác nhau (ngắn/dài, formal/informal, tiếng Việt/tiếng Anh), từ đó tạo ra một tập dataset đa dạng phủ khắp grid (khoảng 40–50 test inputs cho toàn bộ hệ thống).", "sources": [{"doc_id": "slide-day19-20", "section_id": "s29", "section": "s29 — Quy trình tạo User Input Grid", "quote": "Quy trình tạo User Input Grid\n\nThiết kế coverage trước khi viết test prompt.\n\nBƯỚC 1                   BƯỚC 2                   BƯỚC 3                  BƯỚC 4                  BƯỚC 5\n\nChọn dimensions          Định nghĩa values        Tạo combinations        Thêm constraint         Viết thành user"}, {"doc_id": "slide-day19-20", "section_id": "s27", "section": "s27 — User Input Grid — những biến", "quote": "Hai chiều ví dụ: Persona × User intent. Mỗi ô là một tình huống khác nhau — con người quyết ô nào đáng test."}, {"doc_id": "ai-evals-m04", "section_id": "the-uig-methodology", "section": "The UIG Methodolog   h+='<div class="card"><div class="meta">'+esc(r.scenario_id)+' &middot; '+esc(o.scope||"")+
  (r.latency_s!=null?' &middot; '+r.latency_s+'s':'')+(r.cost_usd!=null?' &middot; ~$'+r.cost_usd:'')+'</div>';
  if(r.slide)h+='<div class="meta" style="color:#346">Đang xem slide '+esc(r.slide.id)+' — '+esc(r.slide.title)+(r.slide.keyword?' &middot; từ khoá: <b>'+esc(r.slide.keyword)+'</b>':'')+'</div>';
  h+='<div class="q">'+esc(r.input)+'</div>';
  if(r.error)h+='<div class="badge fail">lỗi chạy</div><div class="rat">'+esc(r.error)+'</div>';
  else{h+='<div>'+esc(o.answer||"(không parse được answer)")+'</div>';
   (o.sources||[]).forEach(function(s){h+='<div class="src"><code>'+esc(s.doc_id)+'#'+esc(s.section_id)+'</code> — “'+esc(s.quote)+'”</div>'});
   if(o.followup_questions)h+='<div style="margin-top:6px"><b>Gợi ý hỏi tiếp:</b></div>'+o.followup_questions.map(function(q){return '<div class="fu">• '+esc(q)+'</div>'}).join("");}
  h+='<div style="margin-top:10px">'+badge(r.verdict)+' <span class="rat">'+esc(r.rationale)+'</span></div>'+
  '<div class="lbl" style="margin-top:8px">Nhãn người: '+["pass","fail","uncertain"].map(function(v){
   return '<button data-i="'+i+'" data-v="'+v+'" class="'+(lbl==v?"on":"")+'" onclick="setLabel(this)">'+v+'</button>'}).join(" ")+
  ' <input type="text" class="note" data-i="'+i+'" placeholder="note ngắn (vd: fail vì citation)" value="'+esc(c.note)+'" onchange="setNote(this)">'+
  ' <button data-i="'+i+'" onclick="raw(this)">xem raw</button></div>'+
  '<div class="raw">'+esc(r.raw_content||JSON.stringify(o,null,2))+'</div></div>';});
 el.innerHTML=h||"<p>Không có dòng nào khớp bộ lọc.</p>";
 document.getElementById("stat").textContent=n+"/"+ROWS.length+" dòng";}
function setLabel(b){var r=ROWS[b.dataset.i],c=cur(r.scenario_id,r.human_label);
 if(c.label==b.dataset.v){if(c.note)saved[r.scenario_id]={label:"",note:c.note};else delete saved[r.scenario_id]}
 else saved[r.scenario_id]={label:b.dataset.v,note:c.note};
 localStorage.setItem(KEY,JSON.stringify(saved));render();}
function setNote(inp){var r=ROWS[inp.dataset.i],c=cur(r.scenario_id,r.human_label),n=inp.value.trim();
 if(!n&&!c.label)delete saved[r.scenario_id];else saved[r.scenario_id]={label:c.label,note:n};
 localStorage.setItem(KEY,JSON.stringify(saved));}
function raw(b){var d=b.closest(".card").querySelector(".raw");d.style.display=d.style.display=="block"?"none":"block";}
function exportCsv(){var s="scenario_id,label,note\n";
 function q(x){return '"'+String(x==null?"":x).replace(/"/g,'""')+'"'}
 ROWS.forEach(function(r){var c=cur(r.scenario_id,r.human_label);
  s+=q(r.scenario_id)+","+q(c.label)+","+q(c.note)+"\n"});
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));
 a.download="labels.csv";a.click();}
document.getElementById("flt").onchange=render;render();
</script></body></html>
